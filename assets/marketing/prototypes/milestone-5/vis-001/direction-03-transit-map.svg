<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">VIS-001 prototype direction 03, Transit Map</title>
  <desc id="desc">A single transit-style route passes through Generate, Share, and Claim. Only inside Claim does a bounded branch open; one route is selected and terminates at one participating provider.</desc>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="45" y="43" font-family="Arial, sans-serif" font-size="15" letter-spacing="2" fill="#111">NON-PRODUCTION PROTOTYPE · D03 TRANSIT MAP</text>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="80" y="105" font-size="18">INTENDED PAYMENT</text>
    <text x="282" y="185" font-size="27" font-weight="700">GENERATE</text>
    <text x="570" y="185" font-size="27" font-weight="700">SHARE</text>
    <text x="850" y="185" font-size="27" font-weight="700">CLAIM</text>
  </g>
  <path d="M110 250H875" fill="none" stroke="#222" stroke-width="12" stroke-linecap="round"/>
  <circle cx="110" cy="250" r="20" fill="#fff" stroke="#222" stroke-width="8"/>
  <circle cx="330" cy="250" r="24" fill="#222"/>
  <circle cx="620" cy="250" r="24" fill="#fff" stroke="#222" stroke-width="8"/>
  <circle cx="875" cy="250" r="27" fill="#222"/>
  <rect x="242" y="290" width="176" height="66" rx="5" fill="#222"/>
  <text x="330" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">|| PAY CODE ||</text>
  <path d="M875 277v75M875 352l-115 100M875 352v100M875 352l115 100" fill="none" stroke="#777" stroke-width="8" stroke-linecap="round"/>
  <path d="M875 352v100" fill="none" stroke="#111" stroke-width="13" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#111">
    <text x="875" y="327" font-size="16" font-weight="700">CHOICE INSIDE CLAIM</text>
    <circle cx="760" cy="452" r="21" fill="#fff" stroke="#aaa" stroke-width="6"/>
    <circle cx="875" cy="452" r="25" fill="#111"/>
    <circle cx="990" cy="452" r="21" fill="#fff" stroke="#aaa" stroke-width="6"/>
    <text x="760" y="500" font-size="13">supported</text>
    <text x="875" y="500" font-size="13" font-weight="700">selected</text>
    <text x="990" y="500" font-size="13">supported</text>
  </g>
  <path d="M875 477v72h140" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <rect x="1002" y="526" width="55" height="46" fill="#ddd" stroke="#111" stroke-width="3"/>
  <path d="M995 526l35-25 35 25" fill="none" stroke="#111" stroke-width="3"/>
  <text x="1030" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">provider completes</text>
  <text x="600" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">The route carries the credential. The selected provider completes the financial movement.</text>
</svg>
