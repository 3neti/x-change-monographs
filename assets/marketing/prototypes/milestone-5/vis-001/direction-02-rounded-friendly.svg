    <circle cx="530" cy="250" r="35" fill="#d7d7d7"/>
    <circle cx="670" cy="250" r="35" fill="#d7d7d7"/>
    <rect x="530" y="333" width="140" height="65" rx="28" fill="#222"/>
    <text x="600" y="373" font-size="17" fill="#fff">|| PAY CODE ||</text>
    <path d="M558 285c18 25 66 25 84 0" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/>
