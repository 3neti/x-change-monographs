<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">VIS-001 prototype direction 02, Rounded Friendly</title>
  <desc id="desc">A soft continuous path links an intended payment, a shared Pay Code, and a recipient who opens a bounded choice inside Claim and selects one supported provider for completion.</desc>
