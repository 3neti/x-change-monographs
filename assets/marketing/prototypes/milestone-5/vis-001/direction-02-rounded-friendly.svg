    <text x="205" y="112" font-size="27" font-weight="700">Generate</text>
    <text x="600" y="112" font-size="27" font-weight="700">Share</text>
    <text x="995" y="112" font-size="27" font-weight="700">Claim</text>
  </g>
  <g stroke="#222" stroke-width="3" fill="#fff">
