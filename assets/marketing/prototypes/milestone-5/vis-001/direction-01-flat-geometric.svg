<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">VIS-001 prototype direction 01, Flat Geometric</title>
  <desc id="desc">Three geometric scenes show a governed payment generating one Pay Code, the credential moving to a recipient, and the recipient choosing one of three supported destinations inside Claim before one provider completes the journey.</desc>
  <rect width="1200" height="650" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="44" y="42" font-size="15" letter-spacing="2">NON-PRODUCTION PROTOTYPE · D01 FLAT GEOMETRIC</text>
    <text x="120" y="105" font-size="28" font-weight="700">GENERATE</text>
    <text x="500" y="105" font-size="28" font-weight="700">SHARE</text>
    <text x="875" y="105" font-size="28" font-weight="700">CLAIM</text>
  </g>
  <g stroke="#111" stroke-width="4" fill="none">
    <rect x="55" y="135" width="315" height="410"/>
    <rect x="443" y="135" width="315" height="410"/>
    <rect x="830" y="135" width="315" height="410"/>
    <path d="M370 340H443"/>
    <path d="M425 328l18 12-18 12" fill="#111"/>
    <path d="M758 340H830"/>
    <path d="M812 328l18 12-18 12" fill="#111"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="95" y="180" width="235" height="88" fill="#e5e5e5" stroke="#111" stroke-width="3"/>
    <text x="212" y="215" font-size="15">INTENDED PAYMENT</text>
    <path d="M212 268v50" stroke="#111" stroke-width="4"/>
    <path d="M200 300l12 18 12-18" fill="#111"/>
    <rect x="122" y="318" width="180" height="76" fill="#111"/>
    <text x="212" y="365" font-size="22" fill="#fff">|| PAY CODE ||</text>
    <text x="212" y="438" font-size="14">governed institution</text>

    <circle cx="505" cy="245" r="38" fill="#d0d0d0" stroke="#111" stroke-width="3"/>
    <path d="M505 283v94M465 323h80" stroke="#111" stroke-width="4"/>
    <rect x="558" y="306" width="150" height="68" fill="#111"/>
    <text x="633" y="348" font-size="18" fill="#fff">|| PAY CODE ||</text>
    <path d="M535 340h23" stroke="#111" stroke-width="4"/>
    <text x="600" y="432" font-size="14">portable channel</text>

    <circle cx="900" cy="225" r="34" fill="#d0d0d0" stroke="#111" stroke-width="3"/>
    <path d="M900 259v72M867 292h66" stroke="#111" stroke-width="4"/>
    <rect x="944" y="260" width="156" height="62" fill="#111"/>
    <text x="1022" y="298" font-size="17" fill="#fff">|| PAY CODE ||</text>
    <text x="982" y="365" font-size="15" font-weight="700">CHOOSE ONE</text>
    <path d="M982 374v35M982 409l-75 55M982 409v55M982 409l75 55" stroke="#111" stroke-width="3" fill="none"/>
    <circle cx="907" cy="470" r="20" fill="#fff" stroke="#999" stroke-width="3"/>
    <circle cx="982" cy="470" r="20" fill="#111"/>
    <circle cx="1057" cy="470" r="20" fill="#fff" stroke="#999" stroke-width="3"/>
    <path d="M982 490v24h72" stroke="#111" stroke-width="3" fill="none"/>
    <circle cx="1066" cy="514" r="12" fill="#111"/>
    <text x="982" y="536" font-size="13">provider completes</text>
  </g>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111">Generate → Share → Claim · choice remains inside Claim</text>
</svg>
