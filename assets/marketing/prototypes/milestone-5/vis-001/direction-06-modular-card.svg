<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">VIS-001 prototype direction 06, Modular Card System</title>
  <desc id="desc">Three numbered modules contain Generate, Share, and Claim. The Claim module contains a subordinate recipient-choice card with three destinations and one selected completion.</desc>
  <rect width="1200" height="650" fill="#eee"/>
  <text x="45" y="42" font-family="Arial, sans-serif" font-size="15" letter-spacing="2" fill="#111">NON-PRODUCTION PROTOTYPE · D06 MODULAR CARD SYSTEM</text>
