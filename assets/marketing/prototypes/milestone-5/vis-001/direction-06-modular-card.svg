    <rect x="137" y="355" width="166" height="66" fill="#111"/>
    <text x="220" y="395" font-size="17" fill="#fff">|| PAY CODE ||</text>

    <circle cx="515" cy="260" r="38" fill="#ddd" stroke="#111" stroke-width="2"/>
    <circle cx="685" cy="260" r="38" fill="#ddd" stroke="#111" stroke-width="2"/>
    <path d="M554 260h90" stroke="#111" stroke-width="4"/>
    <path d="M625 246l20 14-20 14" fill="#111"/>
    <rect x="520" y="352" width="160" height="66" fill="#111"/>
    <text x="600" y="392" font-size="17" fill="#fff">|| PAY CODE ||</text>
