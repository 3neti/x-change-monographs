    <text x="460" y="130" font-size="44" font-weight="700">02</text>
    <text x="840" y="130" font-size="44" font-weight="700">03</text>
    <text x="80" y="172" font-size="25" font-weight="700">GENERATE</text>
    <text x="460" y="172" font-size="25" font-weight="700">SHARE</text>
    <text x="840" y="172" font-size="25" font-weight="700">CLAIM</text>
  </g>
