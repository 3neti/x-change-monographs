<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Milestone 5.1 corrected D01 Flat Geometric control</title>
  <desc id="desc">One Pay Code appears after a payment intent, occupies a continuous credential trace through Share, and arrives at the recipient in Claim, where one of three supported destinations is selected before provider completion.</desc>
  <rect width="1200" height="650" fill="#fff"/>
