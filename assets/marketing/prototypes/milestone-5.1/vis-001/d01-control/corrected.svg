    <text x="90" y="115" font-size="27" font-weight="700">GENERATE</text>
    <text x="455" y="115" font-size="27" font-weight="700">SHARE</text>
    <text x="795" y="115" font-size="30" font-weight="700">CLAIM</text>
  </g>
  <rect x="55" y="145" width="300" height="360" fill="#f5f5f5" stroke="#777" stroke-width="2"/>
