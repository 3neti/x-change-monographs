<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Milestone 5.1 corrected D03 Transit Map</title>
  <desc id="desc">A single outlined Pay Code marker occupies three positions along a credential route from Generate through Share and becomes solid when it stops beside the recipient at Claim. Choice then branches locally to one selected supported destination and a separate dotted provider-completion trace.</desc>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="44" y="42" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">NON-PRODUCTION PROTOTYPE · M5.1 · D03 TRANSIT MAP</text>
  <g font-family="Arial, sans-serif" fill="#111" text-anchor="middle">
    <text x="260" y="130" font-size="27" font-weight="700">GENERATE</text>
    <text x="570" y="130" font-size="27" font-weight="700">SHARE</text>
    <text x="865" y="130" font-size="30" font-weight="700">CLAIM</text>
  </g>
  <rect x="70" y="190" width="150" height="75" fill="#ddd" stroke="#111" stroke-width="2"/>
  <text x="145" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">PAYMENT INTENT</text>
  <text x="145" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">authorized ✓</text>
  <path d="M220 300H865" stroke="#bbb" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M220 300H865" stroke="#111" stroke-width="2" stroke-dasharray="6 12" fill="none"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="235" y="270" width="130" height="60" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="300" y="306" font-size="14">|| PAY CODE ||</text>
    <rect x="505" y="270" width="130" height="60" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="570" y="306" font-size="14">|| PAY CODE ||</text>
    <rect x="800" y="263" width="150" height="74" fill="#111"/>
    <text x="875" y="308" font-size="17" fill="#fff">|| PAY CODE ||</text>
  </g>
  <circle cx="750" cy="224" r="30" fill="#ddd" stroke="#111" stroke-width="3"/>
  <path d="M750 254v78M720 294h60" stroke="#111" stroke-width="4"/>
  <text x="875" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700">MOVEMENT STOPS · RECIPIENT CHOOSES</text>
  <path d="M875 337v62M875 399l-120 70M875 399v70M875 399l120 70" stroke="#777" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M875 399v70" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="755" cy="470" r="21" fill="#fff" stroke="#aaa" stroke-width="5"/>
  <circle cx="875" cy="470" r="24" fill="#111"/>
  <circle cx="995" cy="470" r="21" fill="#fff" stroke="#aaa" stroke-width="5"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="11">
    <text x="755" y="507">participating</text>
    <text x="875" y="507" font-weight="700">selected</text>
    <text x="995" y="507">participating</text>
  </g>
  <path d="M875 494v60h205" stroke="#555" stroke-width="3" stroke-dasharray="4 7" fill="none"/>
  <rect x="1080" y="530" width="58" height="46" fill="#ddd" stroke="#111" stroke-width="2"/>
  <path d="M1073 530l36-25 36 25" stroke="#111" stroke-width="2" fill="none"/>
  <text x="1109" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">provider completes after Claim</text>
  <text x="500" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">credential route · not a money rail</text>
