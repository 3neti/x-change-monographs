  <title id="title">Visual Sprint Zero Hybrid Convergence study</title>
  <desc id="desc">A restrained route crosses open semantic fields anchored by sender and recipient figures. The same illustrative framed alphanumeric Pay Code 7K9M-4R2P persists. SMS, print, and a small optional QR are secondary. Choice remains inside the larger Claim field and selects one destination.</desc>
